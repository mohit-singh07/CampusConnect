<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact - CampusConnect</title>

    <link rel="stylesheet" href="../CSS Client/style.css">

</head>

<body>

<nav class="top">

    <h2>CampusConnect</h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

</nav>


<section class="page-header">

    <h1>Contact Us</h1>

    <p>Have a question? Get in touch with us.</p>

</section>


<section class="contact">

    <div class="contact-info">

        <h2>Get In Touch</h2>

        <p>📧 campusconnect@gmail.com</p>

        <p>📞 +91 99998 99998</p>

        <p>📍 CampusConnect, University Campus</p>

    </div>


    <form id="contactForm">

        <label>Name</label>

        <input type="text"
               id="contactName"
               placeholder="Enter your name">


        <label>Email</label>

        <input type="email"
               id="contactEmail"
               placeholder="Enter your email">


        <label>Department</label>

        <input type="text"
               id="subject"
               placeholder="Enter Department">


        <label>Message</label>

        <textarea id="message"
                  rows="6"
                  placeholder="Write your message"></textarea>


        <button type="submit" class="btn">
            Send Message
        </button>

    </form>

</section>


<footer>

    <h3>CampusConnect</h3>

    <p>© 2026 CampusConnect. All Rights Reserved.</p>

</footer>

<script src="../ClientJS/script.js"></script>
</body>
</html>
