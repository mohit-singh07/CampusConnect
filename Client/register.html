<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Event Registration - CampusConnect</title>

    <link rel="stylesheet" href="../CSS Client/style.css">
</head>

<body>

<nav class="top">

    <h2>CampusConnect</h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="event.html">Events</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

</nav>


<section class="page-header">

    <h1>Event Registration</h1>

    <p>Register for your selected campus event</p>

</section>


<section class="form-container">

    <form id="registrationForm">

        <label>Full Name</label>

        <input type="text"
               id="name"
               placeholder="Enter your full name">


        <label>Email</label>

        <input type="email"
               id="email"
               placeholder="Enter your email">


        <label>Enrollment Number</label>

        <input type="text"
               id="enrollment"
               placeholder="Enter enrollment number">


        <label>Select Event</label>

        <select id="event">

            <option value="">Select Event</option>

            <option>Tech Hackathon</option>

            <option>Cultural Fest</option>

            <option>Sports Meet</option>

            <option>Web Development Workshop</option>

        </select>


        <label>Phone Number</label>

        <input type="tel"
               id="phone"
               placeholder="Enter phone number">


        <button type="submit" class="btn">
            Register
        </button>

    </form>

</section>


<footer>

    <h3>CampusConnect</h3>

    <p>© 2026 CampusConnect. All Rights Reserved.</p>

</footer>

<script src="../ClientJS/script.js"></script>
</body>
</html>
