<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CampusConnect</title>

    <link rel="stylesheet" href="../CSS Admin/style.css">

</head>

<body class="admin-login">

<div class="login-box">

    <h1>CampusConnect</h1>

    <h2>Admin Login</h2>

    <form id="adminLoginForm">

        <label>Email</label>

        <input type="email"
               id="adminEmail"
               placeholder="Admin email">


        <label>Password</label>

        <input type="password"
               id="adminPassword"
               placeholder="Password">


        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <a href="../Client/index.html">Back to Website</a>

</div>

<script src="../AdminJS/script.js"></script>
</body>
</html>
